<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Chatbot</title>

    <!-- Puter.js -->
    <script src="https://js.puter.com/v2/"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 700px;
            max-width: 95%;
            margin: 40px auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .chat {
            height: 500px;
            overflow-y: auto;
            padding: 20px;
        }

        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 10px;
            max-width: 80%;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .user {
            background: #dbeafe;
            margin-left: auto;
        }

        .ai {
            background: #eeeeee;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
            gap: 10px;
        }

        #message {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            background: #999;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <h2>New AI Chatbot</h2>
        
    </div>

    <div id="chat" class="chat"></div>

    <div class="input-area">

        <input
            id="message"
            type="text"
            placeholder="Ask something..."
        >

        <button id="sendButton">
            Send
        </button>

    </div>

</div>


<script>

    // Store conversation
    let conversation = [];


    const messageInput =
        document.getElementById("message");

    const sendButton =
        document.getElementById("sendButton");

    const chat =
        document.getElementById("chat");


    // Send when Enter is pressed
    messageInput.addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                sendMessage();
            }

        }
    );


    sendButton.addEventListener(
        "click",
        sendMessage
    );


    async function sendMessage() {

        const text =
            messageInput.value.trim();


        if (!text) {
            return;
        }


        // Display user message
        addMessage(
            "You",
            text,
            "user"
        );


        // Clear input
        messageInput.value = "";


        // Add user message to conversation
        conversation.push({
            role: "user",
            content: text
        });


        // Disable button
        sendButton.disabled = true;

        sendButton.textContent = "Thinking...";


        try {

            /*
             * Call Puter AI
             */

            const response =
                await puter.ai.chat(
                    conversation,
                    {
                        model: "gpt-5.4-nano"
                    }
                );


            /*
             * Get AI response
             */

            const answer =
                response.message
                    .content;


            // Display AI response
            addMessage(
                "AI",
                answer,
                "ai"
            );


            // Save AI response
            conversation.push({
                role: "assistant",
                content: answer
            });


        }
        catch (error) {

            console.error(error);

            addMessage(
                "AI",
                "Error: " + error.message,
                "ai"
            );

        }


        // Enable button
        sendButton.disabled = false;

        sendButton.textContent = "Send";

        messageInput.focus();

    }


    function addMessage(
        sender,
        text,
        className
    ) {

        const message =
            document.createElement("div");


        message.className =
            "message " + className;


        message.innerHTML =
            `<strong>${sender}:</strong><br>${text}`;


        chat.appendChild(message);


        // Scroll to bottom
        chat.scrollTop =
            chat.scrollHeight;

    }

</script>

</body>

</html>
